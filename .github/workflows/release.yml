name: Validate and release QuestLite

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --target .tools -r tests/requirements.txt
      - name: Run Lua behavior checks
        run: python tests/test_addon.py
      - name: Run package checks
        run: python tests/test_package.py
      - name: Build packages
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package.py --tag "$RELEASE_TAG"
          else
            python tools/package.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QuestLite-packages
          if-no-files-found: error
          path: |
            dist/QuestLite*.zip
            dist/SHA256SUMS.txt
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuestLite-packages
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "QuestLite $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" \
            "dist/QuestLite-${RELEASE_TAG#v}.zip" dist/QuestLite.zip dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
